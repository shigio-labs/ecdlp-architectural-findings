[project]
name = "ecdlp-architectural-findings"
version = "1.0.0"
description = "Research note: architectural trade-offs in space-efficient ECDLP"
authors = [{name = "Paul Mutov"}]
requires-python = ">=3.10"
dependencies = ["gmpy2", "numpy"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["rns/tests", "delta/tests", "experiments/tests"]
pythonpath = ["."]
filterwarnings = ["error"]